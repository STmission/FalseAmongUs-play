  <details id="playtest-help"><summary>玩法与操作</summary><div><strong>网页试玩 · 单人调查</strong><p>点击「单人剧情」进入。你与11名职业NPC调查废校，在四天内收集线索、辨认伪人并投票。</p><p>电脑：WASD移动，按住鼠标右键转动视角，Shift冲刺，E交谈／交互，V切换第一／第三人称，F身份技能，R使用工具，Esc菜单。</p><p>吃零食可恢复体力。想离开，点击右上角「退出对局」。手机请横屏，用移动摇杆与屏幕按钮；建议先用电脑试玩。</p><p>首次载入需要下载3D资源，请稍候。当前美术与剧情仍在制作，真人联机、微信与iOS完整版将继续完成。</p><p><a href="https://github.com/STmission/FalseAmongUs-play/issues" target="_blank" rel="noopener">反馈问题</a> · <a href="https://github.com/STmission/FalseAmongUs-play" target="_blank" rel="noopener">GitHub仓库</a></p></div></details><style>#playtest-help{position:fixed;top:8px;left:8px;z-index:9999;max-width:min(420px,calc(100vw - 32px));color:#eee8d6;background:#182323ef;border:1px solid #64756b;border-radius:8px;padding:8px 12px;font:14px/1.6 sans-serif}#playtest-help summary{cursor:pointer}#playtest-help div{max-height:65vh;overflow:auto}#playtest-help p{margin:8px 0}#playtest-help a{color:#b5dac3}</style>
